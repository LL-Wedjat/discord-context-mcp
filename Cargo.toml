[package]
name = "discord-context-mcp"
version = "1.3.0"
edition = "2021"
repository = "https://github.com/LL-Wedjat/discord-context-mcp"
homepage = "https://github.com/LL-Wedjat/discord-context-mcp#readme"

[[bin]]
name = "discord-context-mcp"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
rusqlite = { version = "0.33", features = ["bundled", "bundled-full"] }
keyring = { version = "3.6", features = ["windows-native"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "6.0"
toml_edit = "0.22"
axum = "0.8"
url = "2.5"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.20"
eframe = "0.31"
egui = "0.31"
tray-icon = "0.21"
muda = "0.17"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.60"
features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"]

[dev-dependencies]
tempfile = "3.17"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "unwind"
